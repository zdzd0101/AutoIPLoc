name: Build TrollStore TIPA and Tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and Sign TIPA and DEB
        run: |
          set -e
          mkdir -p Payload/AutoIPLoc.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          # 1. 编译巨魔 App (.tipa)
          swiftc main.swift \
            -parse-as-library \
            -import-objc-header Bridge.h \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios15.0 \
            -framework SwiftUI -framework UIKit -framework CoreLocation -framework Network -framework AVFoundation \
            -o Payload/AutoIPLoc.app/AutoIPLoc

          cp Info.plist Payload/AutoIPLoc.app/Info.plist

          curl -fsSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64 -o ldid
          chmod +x ldid
          ./ldid -Sentitlements.plist Payload/AutoIPLoc.app/AutoIPLoc

          zip -r AutoIPLoc.tipa Payload

          # 2. 编译配套底层钩子插件 (.deb，使用系统原生 tar + ar 零依赖打包)
          mkdir -p deb_control
          mkdir -p deb_data/var/jb/Library/MobileSubstrate/DynamicLibraries

          cat << 'EOF' > deb_control/control
          Package: com.local.autoiploc.hook
          Name: AutoIPLocHook
          Version: 2.0.0
          Architecture: iphoneos-arm64
          Description: Force Apple International Maps & Wi-Fi SSID sync for AutoIPLoc
          Maintainer: AutoIPLoc
          Author: AutoIPLoc
          Section: Tweaks
          EOF

          clang -dynamiclib \
            -arch arm64 -arch arm64e \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -framework Foundation -framework SystemConfiguration \
            -fobjc-arc \
            Tweak/AutoIPLocHook.m \
            -o deb_data/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.dylib

          ./ldid -S deb_data/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.dylib
          cp Tweak/AutoIPLocHook.plist deb_data/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.plist

          # 组装标准 Debian 安装包 (禁用 macOS AppleDouble 隐藏文件)
          printf "2.0\n" > debian-binary
          COPYFILE_DISABLE=1 tar -czf control.tar.gz -C deb_control .
          COPYFILE_DISABLE=1 tar -czf data.tar.gz -C deb_data .
          ar -rc AutoIPLocHook.deb debian-binary control.tar.gz data.tar.gz

          ls -lh AutoIPLoc.tipa AutoIPLocHook.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoIPLoc-Release
          path: |
            AutoIPLoc.tipa
            AutoIPLocHook.deb
