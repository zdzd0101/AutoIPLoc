name: Build TrollStore TIPA and Tweak
on: [push, workflow_dispatch]

concurrency:
  group: build-autoiploc
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install dpkg

      - name: Compile and Sign TIPA and DEB
        run: |
          set -e
          unset SDKROOT
          mkdir -p Payload/AutoIPLoc.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          swiftc main.swift \
            -parse-as-library \
            -import-objc-header Bridge.h \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios15.0 \
            -framework SwiftUI -framework UIKit -framework CoreLocation -framework Network \
            -o Payload/AutoIPLoc.app/AutoIPLoc

          cp Info.plist Payload/AutoIPLoc.app/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" Payload/AutoIPLoc.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" Payload/AutoIPLoc.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" Payload/AutoIPLoc.app/Info.plist

          curl -fsSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_x86_64 -o ldid
          chmod +x ldid
          ./ldid -Sentitlements.plist Payload/AutoIPLoc.app/AutoIPLoc

          zip -r AutoIPLoc.tipa Payload

          mkdir -p deb_pkg/DEBIAN
          mkdir -p deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries

          clang -dynamiclib \
            -arch arm64 -arch arm64e \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -Wno-deprecated-declarations \
            -install_name /Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.dylib \
            -framework Foundation -framework UIKit -framework CoreLocation -framework CoreTelephony -framework SystemConfiguration -framework CFNetwork \
            -fobjc-arc \
            Tweak/AutoIPLocHook.m \
            -o deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.dylib

          codesign --force --sign - --timestamp=none deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.dylib

          cat << 'EOF' > deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>com.apple.Maps</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > deb_pkg/DEBIAN/postinst
          #!/bin/sh
          if [ -d "/rootfs/var/mobile/Library/Preferences" ]; then
            REAL_PREF="/rootfs/var/mobile/Library/Preferences"
          else
            REAL_PREF="/var/mobile/Library/Preferences"
          fi
          LINK_PREF="/var/mobile/Library/Preferences"

          if [ ! -s "$REAL_PREF/com.autoiploc.filter.plist" ]; then
            cat << 'PLISTEOF' > "$REAL_PREF/com.autoiploc.filter.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>com.apple.Maps</string>
                  </array>
              </dict>
          </dict>
          </plist>
          PLISTEOF
          fi

          touch "$REAL_PREF/com.autoiploc.geo.plist" "$REAL_PREF/com.autoiploc.wifi.plist" 2>/dev/null || true
          chown mobile:staff "$REAL_PREF/com.autoiploc.filter.plist" "$REAL_PREF/com.autoiploc.geo.plist" "$REAL_PREF/com.autoiploc.wifi.plist" 2>/dev/null || true
          chmod 666 "$REAL_PREF/com.autoiploc.filter.plist" "$REAL_PREF/com.autoiploc.geo.plist" "$REAL_PREF/com.autoiploc.wifi.plist" 2>/dev/null || true

          for JB in /var/containers/Bundle/Application/.jbroot-*; do
            if [ -d "$JB" ]; then
              printf "%s\n" "$JB" > /var/tmp/com.autoiploc.jbroot.txt
              chmod 666 /var/tmp/com.autoiploc.jbroot.txt

              if [ -d "$JB/usr/lib/TweakInject" ]; then
                rm -f "$JB/usr/lib/TweakInject/AutoIPLocHook.plist" "$JB/usr/lib/TweakInject/AutoIPLoc.geo.plist" "$JB/usr/lib/TweakInject/AutoIPLoc.wifi.plist" "$JB/usr/lib/TweakInject/"*hookstatus* 2>/dev/null || true
                ln -sf "$LINK_PREF/com.autoiploc.filter.plist" "$JB/usr/lib/TweakInject/AutoIPLocHook.plist" 2>/dev/null || true
                ln -sf "$LINK_PREF/com.autoiploc.geo.plist" "$JB/usr/lib/TweakInject/AutoIPLoc.geo.plist" 2>/dev/null || true
                ln -sf "$LINK_PREF/com.autoiploc.wifi.plist" "$JB/usr/lib/TweakInject/AutoIPLoc.wifi.plist" 2>/dev/null || true
              fi
              if [ -d "$JB/Library/MobileSubstrate/DynamicLibraries" ] && [ ! -L "$JB/Library/MobileSubstrate/DynamicLibraries" ]; then
                rm -f "$JB/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.plist" "$JB/Library/MobileSubstrate/DynamicLibraries/AutoIPLoc.geo.plist" "$JB/Library/MobileSubstrate/DynamicLibraries/AutoIPLoc.wifi.plist" "$JB/Library/MobileSubstrate/DynamicLibraries/"*hookstatus* 2>/dev/null || true
                ln -sf "$LINK_PREF/com.autoiploc.filter.plist" "$JB/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.plist" 2>/dev/null || true
                ln -sf "$LINK_PREF/com.autoiploc.geo.plist" "$JB/Library/MobileSubstrate/DynamicLibraries/AutoIPLoc.geo.plist" 2>/dev/null || true
                ln -sf "$LINK_PREF/com.autoiploc.wifi.plist" "$JB/Library/MobileSubstrate/DynamicLibraries/AutoIPLoc.wifi.plist" 2>/dev/null || true
              fi
            fi
          done

          if [ -d "/usr/lib/TweakInject" ]; then
            rm -f "/usr/lib/TweakInject/AutoIPLocHook.plist" "/usr/lib/TweakInject/AutoIPLoc.geo.plist" "/usr/lib/TweakInject/AutoIPLoc.wifi.plist" /usr/lib/TweakInject/*hookstatus* 2>/dev/null || true
            ln -sf "$LINK_PREF/com.autoiploc.filter.plist" "/usr/lib/TweakInject/AutoIPLocHook.plist" 2>/dev/null || true
            ln -sf "$LINK_PREF/com.autoiploc.geo.plist" "/usr/lib/TweakInject/AutoIPLoc.geo.plist" 2>/dev/null || true
            ln -sf "$LINK_PREF/com.autoiploc.wifi.plist" "/usr/lib/TweakInject/AutoIPLoc.wifi.plist" 2>/dev/null || true
          fi

          rm -f /var/tmp/*hookstatus* /rootfs/var/tmp/*hookstatus* \
                /var/mobile/Library/Preferences/*hookstatus* /rootfs/var/mobile/Library/Preferences/*hookstatus* \
                /rootfs/var/mobile/Containers/Data/Application/*/Library/Caches/com.autoiploc.hookstatus.plist \
                /rootfs/var/mobile/Containers/Data/Application/*/tmp/com.autoiploc.hookstatus.plist \
                /var/mobile/Containers/Data/Application/*/Library/Caches/com.autoiploc.hookstatus.plist \
                /var/mobile/Containers/Data/Application/*/tmp/com.autoiploc.hookstatus.plist 2>/dev/null || true
          exit 0
          EOF

          INSTALLED_SIZE=$(du -sk deb_pkg/var | cut -f1)
          printf "Package: com.local.autoiploc.hook\nName: AutoIPLocHook\nVersion: 5.2.1\nArchitecture: iphoneos-arm64\nDepends: firmware (>= 15.0)\nInstalled-Size: %s\nDescription: Fat arm64+arm64e RootHide-safe stealth hook v5.2.1 (sandbox-proof container heartbeat, persistent Darwin notify token & unified symlink config sync)\nMaintainer: AutoIPLoc\nAuthor: AutoIPLoc\nSection: Tweaks\n" "$INSTALLED_SIZE" > deb_pkg/DEBIAN/control

          chmod 0755 deb_pkg/DEBIAN
          chmod 0755 deb_pkg/DEBIAN/postinst
          chmod 0644 deb_pkg/DEBIAN/control
          chmod 0755 deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.dylib
          chmod 0666 deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.plist

          dpkg-deb -Zgzip -b deb_pkg AutoIPLocHook.deb
          ls -lh AutoIPLoc.tipa AutoIPLocHook.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoIPLoc-Release
          path: |
            AutoIPLoc.tipa
            AutoIPLocHook.deb
