name: Build TrollStore TIPA and Tweak
on: [push, workflow_dispatch]

concurrency:
  group: build-autoiploc
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install dpkg

      - name: Compile and Sign TIPA and DEB
        run: |
          set -e
          unset SDKROOT
          mkdir -p Payload/AutoIPLoc.app
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          IOS_CLANG="$(xcrun --sdk iphoneos --find clang)"
          IOS_SWIFTC="$(xcrun --sdk iphoneos --find swiftc)"
          SDK_NAME="$(basename "$SDK_PATH")"
          case "$SDK_NAME" in
            iPhoneOS*.sdk) ;;
            *) echo "Expected iPhoneOS SDK, got: $SDK_PATH" >&2; exit 1 ;;
          esac
          echo "Using iPhoneOS SDK: $SDK_PATH"
          xcrun --sdk iphoneos --show-sdk-version

          "$IOS_SWIFTC" main.swift \
            -parse-as-library \
            -import-objc-header Bridge.h \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios15.0 \
            -Xcc -isysroot -Xcc "$SDK_PATH" \
            -framework SwiftUI -framework UIKit -framework CoreLocation -framework Network -framework AVFoundation \
            -o Payload/AutoIPLoc.app/AutoIPLoc

          cp Info.plist Payload/AutoIPLoc.app/Info.plist
          plutil -lint Info.plist
          plutil -lint entitlements.plist
          plutil -lint Tweak/AutoIPLocHook.plist
          echo "Checking Hook source safety invariants..."
          grep -Fq "MethodHasExpectedSignature" Tweak/AutoIPLocHook.m
          grep -Fq "object_setIvarWithStrongDefault" Tweak/AutoIPLocHook.m
          grep -Fq "methodMatchesSignature" main.swift
          grep -Fq "method_copyArgumentType" main.swift
          grep -Fq "hook_freeifaddrs" Tweak/AutoIPLocHook.m
          grep -Fq "INSTALL_C_FUNCTION_HOOK(freeifaddrs" Tweak/AutoIPLocHook.m
          if grep -Fq "memcpy(head, nextNode" Tweak/AutoIPLocHook.m; then
            echo "Unsafe in-place ifaddrs list mutation detected" >&2
            exit 1
          fi
          if grep -Eq '\(IMP \*\)&orig_|\(void \*\*\)&orig_' Tweak/AutoIPLocHook.m; then
            echo "Aliased typed function-pointer storage passed to hook API" >&2
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" Payload/AutoIPLoc.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" Payload/AutoIPLoc.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" Payload/AutoIPLoc.app/Info.plist

          curl -fsSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_x86_64 -o ldid
          chmod +x ldid
          ./ldid -Sentitlements.plist Payload/AutoIPLoc.app/AutoIPLoc

          zip -r AutoIPLoc.tipa Payload

          mkdir -p deb_pkg/DEBIAN
          mkdir -p deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries

          "$IOS_CLANG" -dynamiclib \
            -arch arm64 -arch arm64e \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -install_name /Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.dylib \
            -framework Foundation -framework UIKit -framework CoreLocation -framework CoreTelephony -framework SystemConfiguration -framework CFNetwork \
            -fobjc-arc \
            Tweak/AutoIPLocHook.m \
            -o deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.dylib

          MAIN_BIN="Payload/AutoIPLoc.app/AutoIPLoc"
          HOOK_BIN="deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.dylib"

          echo "Validating Mach-O architecture slices..."
          lipo -info "$MAIN_BIN"
          lipo "$MAIN_BIN" -verify_arch arm64
          lipo -info "$HOOK_BIN"
          lipo "$HOOK_BIN" -verify_arch arm64 arm64e
          for ARCH in arm64 arm64e; do
            otool -arch "$ARCH" -l "$HOOK_BIN" | awk '
              /cmd LC_BUILD_VERSION/ { in_build = 1; next }
              /cmd LC_VERSION_MIN_IPHONEOS/ { legacy_ios = 1 }
              /cmd LC_/ && !/LC_BUILD_VERSION/ { in_build = 0 }
              in_build && /platform 2/ { modern_ios = 1 }
              END { exit (modern_ios || legacy_ios) ? 0 : 1 }
            ' || {
              echo "Hook $ARCH slice is not marked as an iOS binary" >&2
              otool -arch "$ARCH" -l "$HOOK_BIN" >&2
              exit 1
            }
          done

          codesign --force --sign - --timestamp=none "$HOOK_BIN"
          codesign --verify --verbose=2 "$HOOK_BIN"

          cp Tweak/AutoIPLocHook.plist \
            deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.plist
          plutil -lint deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.plist

          cat << 'EOF' > deb_pkg/DEBIAN/postinst
          #!/bin/sh
          set -eu
          umask 022

          ROOT_FILE="/var/tmp/com.autoiploc.jbroot.txt"
          ROOT_TMP="${ROOT_FILE}.$$"
          ROOT_DIR="/var/containers/Bundle/Application"

          : > "$ROOT_TMP"
          for JB in "$ROOT_DIR"/.jbroot-*; do
            if [ -d "$JB" ]; then
              printf "%s\n" "$JB" >> "$ROOT_TMP"
            fi
          done

          if [ -s "$ROOT_TMP" ]; then
            chmod 0644 "$ROOT_TMP"
            mv -f "$ROOT_TMP" "$ROOT_FILE"
          else
            rm -f "$ROOT_TMP" "$ROOT_FILE"
          fi
          exit 0
          EOF

          INSTALLED_SIZE=$(du -sk deb_pkg/var | cut -f1)
          printf "Package: com.local.autoiploc.hook\nName: AutoIPLocHook\nVersion: 4.3.1\nArchitecture: iphoneos-arm64\nDepends: firmware (>= 15.0)\nInstalled-Size: %s\nDescription: Fat arm64+arm64e XPC-level CLLocationSourceInformation scrub & RootHide ElleKit stealth hook\nMaintainer: AutoIPLoc\nAuthor: AutoIPLoc\nSection: Tweaks\n" "$INSTALLED_SIZE" > deb_pkg/DEBIAN/control

          chmod 0755 deb_pkg/DEBIAN
          chmod 0755 deb_pkg/DEBIAN/postinst
          chmod 0644 deb_pkg/DEBIAN/control
          chmod 0755 deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.dylib
          chmod 0644 deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.plist

          dpkg-deb --root-owner-group -Zgzip -b deb_pkg AutoIPLocHook.deb
          dpkg-deb --info AutoIPLocHook.deb
          dpkg-deb --contents AutoIPLocHook.deb
          test -s AutoIPLoc.tipa
          test -s AutoIPLocHook.deb
          unzip -l AutoIPLoc.tipa
          ls -lh AutoIPLoc.tipa AutoIPLocHook.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoIPLoc-Release
          path: |
            AutoIPLoc.tipa
            AutoIPLocHook.deb
