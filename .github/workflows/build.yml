name: Build TrollStore TIPA and Tweak
on: [push, workflow_dispatch]

concurrency:
  group: build-autoiploc
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install dpkg

      - name: Compile and Sign TIPA and DEB
        run: |
          set -e
          unset SDKROOT
          mkdir -p Payload/AutoIPLoc.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          swiftc main.swift \
            -parse-as-library \
            -import-objc-header Bridge.h \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios15.0 \
            -framework SwiftUI -framework UIKit -framework CoreLocation -framework Network -framework AVFoundation \
            -o Payload/AutoIPLoc.app/AutoIPLoc

          cp Info.plist Payload/AutoIPLoc.app/Info.plist

          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            LDID_URL="https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64"
          else
            LDID_URL="https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_x86_64"
          fi
          curl -fsSL "$LDID_URL" -o ldid
          chmod +x ldid
          ./ldid -Sentitlements.plist Payload/AutoIPLoc.app/AutoIPLoc

          zip -r AutoIPLoc.tipa Payload

          mkdir -p deb_pkg/DEBIAN
          mkdir -p deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries

          clang -dynamiclib \
            -arch arm64 -arch arm64e \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -framework Foundation -framework UIKit -framework CoreLocation -framework SystemConfiguration -framework CFNetwork \
            -fobjc-arc \
            Tweak/AutoIPLocHook.m \
            -o deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.dylib

          ./ldid -S deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.dylib
          cp Tweak/AutoIPLocHook.plist deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.plist

          INSTALLED_SIZE=$(du -sk deb_pkg/var | cut -f1)
          printf "Package: com.local.autoiploc.hook\nName: AutoIPLocHook\nVersion: 2.1.2\nArchitecture: iphoneos-arm64\nDepends: firmware (>= 15.0)\nInstalled-Size: %s\nDescription: Zero-dep RootHide hook for proxy/NIC stealth, timezone auto-sync & international Maps\nMaintainer: AutoIPLoc\nAuthor: AutoIPLoc\nSection: Tweaks\n" "$INSTALLED_SIZE" > deb_pkg/DEBIAN/control

          chmod 0755 deb_pkg/DEBIAN
          chmod 0644 deb_pkg/DEBIAN/control
          chmod 0755 deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.dylib
          chmod 0644 deb_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AutoIPLocHook.plist

          dpkg-deb -Zgzip -b deb_pkg AutoIPLocHook.deb
          ls -lh AutoIPLoc.tipa AutoIPLocHook.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoIPLoc-Release
          path: |
            AutoIPLoc.tipa
            AutoIPLocHook.deb
